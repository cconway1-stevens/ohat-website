name: Bug report
description: Report something that is broken or behaving incorrectly.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you give, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL
      description: Which page or route does this affect?
      placeholder: e.g. /services/brake-repair
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Both
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Paste or drag in any screenshots that help show the problem.
