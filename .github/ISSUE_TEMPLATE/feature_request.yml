name: Feature request
description: Suggest an idea for the site.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describe what you want and why it helps the shop.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain point or gap this feature would close.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should it do?
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other ways you have thought about solving this.
