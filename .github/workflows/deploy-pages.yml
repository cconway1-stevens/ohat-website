name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the Pages deployment to read the repo and mint an id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      # vinext cannot prerender dynamic routes (the 12 service pages) when
      # basePath is set, so the site has to be served from the domain root.
      - name: Require a root-served Pages site
        if: steps.pages.outputs.base_path != ''
        run: |
          echo "::error::This site must be served from the root of a domain."
          echo "Pages resolved base_path='${{ steps.pages.outputs.base_path }}', which means a project site."
          echo "Fix: set a custom domain in Settings > Pages, or rename the repo to <owner>.github.io."
          exit 1

      - name: Build static site
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
