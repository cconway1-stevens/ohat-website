name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the Pages deployment to read the repo and mint an id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      root_pages_ready: ${{ steps.pages.outputs.base_path == '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # vinext cannot prerender dynamic routes (the 14 service pages) when
      # basePath is set, so the site has to be served from the domain root.
      - name: Check Pages root path
        if: steps.pages.outputs.base_path != ''
        run: |
          echo "::notice::Skipping GitHub Pages deploy until the site is served from a domain root."
          echo "Pages resolved base_path='${{ steps.pages.outputs.base_path }}', which means a project site."
          echo "Fix: set a custom domain in Settings > Pages, or rename the repo to <owner>.github.io."

      - name: Build static site
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.base_path == ''
        with:
          path: dist/client

  deploy:
    needs: build
    if: needs.build.outputs.root_pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
