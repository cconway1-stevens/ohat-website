name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Full quality suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Formatting is checked here rather than in `build:static`, on purpose.
      # It used to run as the first step of the production build, which meant
      # an unformatted file — even one nobody had looked at — failed the Vercel
      # deploy and took the site's updates down with it. A style rule should
      # never be able to block a deploy. Failing here is loud, safe, and fixed
      # with `npm run check:fix`.
      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code
        run: npm run check:deadcode

      - name: Full test suite
        run: npm test

  # Cross-platform guard. The build tooling is written for a Unix shell
  # (bash scripts, `VAR=value cmd` syntax), so it passes on Linux and can
  # silently break on Windows — cmd.exe rejects inline env vars and the WSL
  # `bash` shim rejects `pipefail`. This job runs the same shell-dependent
  # commands on a Windows runner so a portability regression fails CI instead
  # of a developer's machine.
  windows:
    name: Windows build (cross-platform guard)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (catches shell/portability issues)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
