name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      run_resilience:
        description: Run slow-network, memory, and stable Lighthouse checks
        type: boolean
        default: false
      deploy:
        description: Deploy the tested artifact to GitHub Pages (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24

jobs:
  formatting:
    name: 1A · Formatting (PR/manual) · Biome
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Format · Biome
        run: npm run format:check

  static-analysis:
    name: 1B · Lint, types + dead code · Biome/TS
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Lint · Biome
        run: npm run lint
      - name: Next.js · ESLint
        run: npm run lint:next
      - name: Types · TypeScript
        run: npm run typecheck
      - name: Dead code · Knip
        run: npm run check:deadcode
      - name: Architecture · dependency-cruiser
        run: npm run check:architecture
      - name: File size · Node
        run: npm run check:bloat

  test-build:
    name: 2 · Build + unit tests · vinext/Node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Build + Unit · vinext + Node
        run: npm test
      - name: Artifact · GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: dist/client
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  browser-functional:
    name: 3A · Pages, links + browser errors · Playwright/axe
    if: github.event_name != 'schedule'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Browser setup · Playwright
        run: |
          if npm run check:browser:preflight; then
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium (attempt $attempt/3)"
            if ./node_modules/.bin/playwright install --with-deps chromium && npm run check:browser:preflight; then
              exit 0
            fi
          done
          exit 1
      - name: Artifact · GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: dist/client
      - name: Pages + links · Playwright
        run: npm run check:pages
      - name: Assets · Playwright
        run: npm run check:assets
      - name: Bundle size · Node
        run: npm run check:bundle
      - name: Accessibility · axe
        run: npm run check:a11y

  lighthouse:
    name: 3B · Speed + search + accessibility · Lighthouse (${{ matrix.shard_label }})
    if: github.event_name != 'schedule'
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: 0
            shard_label: 1/4
          - shard_index: 1
            shard_label: 2/4
          - shard_index: 2
            shard_label: 3/4
          - shard_index: 3
            shard_label: 4/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Browser setup · Playwright
        run: |
          if npm run check:browser:preflight; then
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium (attempt $attempt/3)"
            if ./node_modules/.bin/playwright install --with-deps chromium && npm run check:browser:preflight; then
              exit 0
            fi
          done
          exit 1
      - name: Artifact · GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: dist/client
      - name: Audit routes · Lighthouse
        run: npm run check:lighthouse:fast
        env:
          LH_SHARD_INDEX: ${{ matrix.shard_index }}
          LH_SHARD_TOTAL: 4
          LH_CONCURRENCY: 2

  dependency-security:
    name: 1C · Dependency vulnerabilities · npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Vulnerabilities · npm audit
        # The npm audit endpoint intermittently answers 503 (registry-side
        # outage); retry a couple of times before declaring a real failure.
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then
              exit 0
            fi
            echo "npm audit failed (attempt $attempt/3) — retrying after backoff"
            sleep 15
          done
          exit 1
      - name: Dependency diff · GitHub
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: development, runtime

  codeql:
    name: 1D · Code security scan · CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup · CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Scan code · CodeQL
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

  windows:
    name: 1E · Windows build (PR/manual) · Node
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Build · vinext
        run: npm run build
      - name: Lint · Biome
        run: npm run lint
      - name: Next.js · ESLint
        run: npm run lint:next
      - name: Types · TypeScript
        run: npm run typecheck

  resilience:
    name: 4 · Slow network + memory (weekly/manual)
    # Intentionally scheduled/manual-only, not per-PR: both checks need a full
    # static build plus Chromium and add several minutes to every run. They are
    # deterministic regressions but slow; run them on demand with
    # `workflow_dispatch` (run_resilience) or on the weekly schedule.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_resilience)
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install · npm
        run: npm ci --prefer-offline
      - name: Browser setup · Playwright
        run: |
          if npm run check:browser:preflight; then
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing Playwright Chromium (attempt $attempt/3)"
            if ./node_modules/.bin/playwright install --with-deps chromium && npm run check:browser:preflight; then
              exit 0
            fi
          done
          exit 1
      - name: Artifact · GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: dist/client
      - name: Slow network · Playwright
        run: npm run check:slow-network
      - name: Memory · Playwright
        run: npm run check:memory
      - name: Stable audit · Lighthouse
        run: npm run check:lighthouse
        env:
          LH_RUNS: 3

  package-pages:
    name: 5 · Website package (manual) · GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [static-analysis, test-build, browser-functional, lighthouse, dependency-security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
    steps:
      - name: Configure · GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Domain root · GitHub Pages
        if: steps.pages.outputs.base_path != ''
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          echo "::error::GitHub Pages resolved a non-root base path: $PAGES_BASE_PATH"
          echo "Configure a custom domain or an owner.github.io repository before deploying."
          exit 1
      - name: Artifact · GitHub
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: static-site-${{ github.run_id }}
          path: dist/client
      - name: Package · GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

  deploy:
    name: 6 · Website publish (manual) · GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: package-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy · GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
