name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bloat:
    name: Code-bloat guard (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Report oversized files
        run: node dev/scripts/check-bloat.mjs

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high

  browser-audits:
    name: Bundle, Lighthouse, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build static site
        run: npm run build:static

      - name: Page smoke test (all pages load, links work)
        run: npm run check:pages

      - name: Bundle-size budget
        run: npm run check:bundle

      - name: Lighthouse audit
        run: npm run check:lighthouse

      - name: Accessibility audit
        run: npm run check:a11y
